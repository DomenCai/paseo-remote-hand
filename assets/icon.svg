<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>
  <g transform="translate(-14 -12)">
    <!-- 加密中继链路:信号从远端节点传到指尖,越近越亮 -->
    <circle cx="288" cy="140" r="13" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="236" cy="132" r="13" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="203" cy="174" r="13" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- 远端节点(brain) -->
    <circle cx="380" cy="160" r="50" fill="none" stroke="#FFFFFF" stroke-width="26"/>
    <circle cx="380" cy="160" r="18" fill="#FFFFFF"/>
    <!-- 手(hand):食指伸出执行操作 -->
    <g fill="#FFFFFF">
      <rect x="170" y="206" width="64" height="196" rx="32"/>
      <rect x="170" y="318" width="192" height="142" rx="58"/>
      <rect x="236" y="292" width="44" height="90" rx="22"/>
      <rect x="282" y="298" width="40" height="84" rx="20"/>
      <rect x="322" y="310" width="40" height="80" rx="20"/>
    </g>
    <path d="M200 420 L132 354" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
